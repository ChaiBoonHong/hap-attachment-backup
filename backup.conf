# HAP attachment backup - settings
# KEY=VALUE lines, no spaces around "=" needed. Each run reads this file; nothing to restart.
# Test the settings with:  sudo hap-attachment-backup --check

# ---- Backup folder and retention
# Where backup sets are written. Any folder on the server (a separate disk is best).
BACKUP_DIR=/data/hap-attachment-backup
# Weekly full copies to keep, and days of nightly (incremental) sets to keep.
KEEP_FULL=4
KEEP_INCR_DAYS=14
# Skip a run if free space on the backup disk would fall below this percentage.
MIN_FREE_PCT=10

# ---- HAP containers
# "auto" finds the HAP containers by image (nocoly/sc + nocoly/hap, or mingdaoyun-sc + mingdaoyun-community).
# Set a name if auto fails or the server runs more than one HAP. List names: docker ps --format '{{.Names}}'
MONGO_CONTAINER=auto
APP_CONTAINER=auto
# MongoDB shell inside MONGO_CONTAINER: auto, mongo or mongosh
MONGO_SHELL=auto
# Only for MongoDB with a password or outside the container, e.g. mongodb://user:password@host:27017/admin
MONGO_URI=
# Storage alias of the mc client inside APP_CONTAINER. List: docker exec <app container> mc alias list
MINIO_ALIAS=file

# ---- File names: <record title><DELIMITER><original file name>.<ext>
# Use the same delimiter in HAP "Import Attachments".
DELIMITER=_
TITLE_MAX_CHARS=100
NAME_MAX_CHARS=150
# yes = one folder per record: <App>/<Worksheet>/<record title>/<record title>_<file name>
# no  = all files of a worksheet in one folder: <App>/<Worksheet>/<record title>_<file name>
RECORD_FOLDERS=no

# ---- Optional app filter: comma-separated app IDs or app names. Empty = all apps.
INCLUDE_APPS=
EXCLUDE_APPS=

# ---- Logging
LOG_FILE=/var/log/hap-attachment-backup.log
# INFO for daily use. DEBUG logs every command and every file - use it while troubleshooting,
# or run a single command with --debug instead.
LOG_LEVEL=INFO

# ---- Timeouts in seconds: MongoDB export, and copying one file
EXPORT_TIMEOUT=3600
COPY_TIMEOUT=3600
