name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile hap_attachment_backup.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Help text
        run: python hap_attachment_backup.py --help
      - name: Runbook page is up to date
        if: matrix.python == '3.12'
        run: python docs/build.py && git diff --exit-code docs/index.html

  shell:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in *.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning *.sh
